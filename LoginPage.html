<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Space - Student Login</title>
    
    <link rel ="stylesheet"href = "style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>Campus Space</h1>
            <p>Student Login Portal</p>
        </div>
        <nav>
        <a href="HomePage.html">🏠 Home</a>
        <a href="DiscussionForum.html">📚 Forum</a>
        <a href="Groups.html">👥 Groups</a>
        <a href="Contact.html">📞 Contact</a>
        <a href="LoginPage.html">🔑 Login</a>
        <a href="Register.html">📝 Register</a>
        <a href="Resources.html">📚 Resources</a>
    </nav>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email or ID</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email or student ID">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <div class="small">
                <label><input id="rem" type="checkbox"> Remember</label>
                <a href="#" onclick="alert('Reset flow')">Forgot?</a>
            </div>
            <div class="error" id="err">Invalid credentials</div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="footer-links">
            <a href="#">Forgot Password?</a>
            <a href="#">Sign Up</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Campus Space. All rights reserved.</p>
    </footer>
</body>
</html>
