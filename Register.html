<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Register - CampusSpace</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>Create your CampusSpace account</h1>
		<p class="lead">Join your campus community — quick and free.</p>

		<div class="nav">
			<a href="HomePage.html">🏠Home</a>
			<a href="LoginPage.html">🔑Login</a>
			<a href="Register.html">📝Register</a>
			<a href="DiscussionForum.html">📚Forum</a>
			<a href="Contact.html">📞Contact</a>
            <a href="Groups.html">👥Groups</a>
            <a href="Resources.html">📚Resources</a>
		</div>

		<form action="/register" method="post">
			<div class="row">
				<div class="col"><input type="text" name="firstName" placeholder="First name" required></div>
				<div class="col"><input type="text" name="lastName" placeholder="Last name" required></div>
			</div>

			<input type="email" name="email" placeholder="Email address" required>

			<div class="row">
				<div class="col"><input type="password" name="password" placeholder="Password" required></div>
				<div class="col"><input type="password" name="confirmPassword" placeholder="Confirm password" required></div>
			</div>

			<select name="role" required>
				<option value="">Select role</option>
				<option value="student">Student</option>
				<option value="faculty">Faculty</option>
				<option value="staff">Staff</option>
			</select>

			<label class="small"><input type="checkbox" name="terms" required> I agree to the <a href="Terms.html">Terms</a> and <a href="Privacy.html">Privacy Policy</a>.</label>

			<button type="submit">Create account</button>
		</form>

		<div class="footer">Already have an account? <a href="Login.html">Sign in</a></div>
	</div>
    <footer>
        <p>&copy; 2026 Campus Space. All rights reserved.</p>
    </footer>
</body>
</html>
